<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Simple Pong</h1>
    <div id="scoreboard">
      <span id="playerScore">0</span>
      <span class="vs">—</span>
      <span id="computerScore">0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <p class="controls">Controls: Move mouse over the game or use Up / Down arrow keys to move the left paddle.</p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
